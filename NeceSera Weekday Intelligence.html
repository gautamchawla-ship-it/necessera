<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NeceSera Weekday Intelligence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: warm-paper report, single 1180px column. Header, strategy brief banner, tabbed panes; white cards on cream with a deep-green accent. Committed single light theme. */
:root{
  color-scheme: light;
  --bg:#f7f3ec; --paper:#ffffff; --soft:#faf7f1; --brief-a:#efe9de; --brief-b:#e5ddcf;
  --line:#e7dfd1; --line-2:#d9cfbd; --dash:#d8cdb9;
  --ink:#1d241f; --ink-2:#3d453f; --muted:#6f6c63; --faint:#9a958a;
  --green:#2f5a43; --green-d:#1f3a2c; --green-soft:#e3ece4; --green-line:#b9cdbd;
  --tab:#1e2822;
  --neg:#b0533d; --neg-soft:#f6e4de; --amb:#a8772a; --amb-soft:#f4ead5; --beige:#c9b28a;
  --sans:"Lato",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(60,48,30,.04),0 8px 24px -16px rgba(60,48,30,.18);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
@media (min-width:760px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.cap{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cap.g{color:var(--green-d)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line-2)}
.id{display:flex;align-items:center;gap:16px;min-width:0}
.logo{width:48px;height:48px;border-radius:10px;background:var(--green);color:#f3efe6;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}
.id h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.005em;line-height:1.25}
.id .cap{margin-top:3px;letter-spacing:.1em}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--soft);font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--green-d)}

/* brief */
.brief{margin-top:34px;border-radius:var(--r-lg);border:1px solid var(--line-2);background:linear-gradient(100deg,var(--brief-a),var(--brief-b));padding:32px 38px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
@media (max-width:720px){.brief{grid-template-columns:1fr;padding:24px}}
.brief h2{margin:12px 0 0;font-size:clamp(22px,2.6vw,30px);line-height:1.35;font-weight:700;letter-spacing:-.01em;max-width:30ch;text-wrap:balance}
.brief h2 u{text-decoration:none;color:var(--green);border-bottom:2px solid var(--green-line);padding-bottom:1px}
.brief .big{text-align:right}
@media (max-width:720px){.brief .big{text-align:left}}
.brief .big .v{font-size:52px;font-weight:700;color:var(--green);line-height:1;margin-top:10px;letter-spacing:-.02em}
.brief .big .v small{font-size:20px;margin-left:2px}

/* tabs */
.tabs{margin-top:32px;display:inline-flex;gap:4px;padding:7px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--brief-a);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;font:inherit;display:inline-flex;align-items:baseline;gap:10px;padding:11px 24px;border-radius:11px;color:var(--ink-2);font-weight:700;font-size:15.5px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.tab span{font-size:12.5px;font-weight:400;color:var(--faint)}
.tab:hover{background:rgba(255,255,255,.55)}
.tab[aria-selected="true"]{background:var(--tab);color:#f5f1e8;box-shadow:0 6px 14px -8px rgba(20,30,24,.6)}
.tab[aria-selected="true"] span{color:#b9bdb4}
.tab:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.pane{margin-top:34px;display:flex;flex-direction:column;gap:22px}
.pane[hidden]{display:none}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.tile{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:26px 22px 24px;box-shadow:var(--shadow);min-width:0}
.tile::after,.mark::after{content:"";position:absolute;top:8px;right:-1px;width:4px;height:28px;border-radius:2px 0 0 2px;background:var(--green-d)}
.tile .l{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:14px;line-height:1.1;white-space:nowrap}
.tile .v small{font-size:14px;color:var(--muted);font-weight:700;margin-left:1px}
.tile .d{margin-top:12px;font-size:13.5px;font-weight:700;color:var(--green-d);line-height:1.4}
.tile .d.neg{color:var(--neg)}
@media (max-width:640px){.tile{padding:20px 16px}.tile .v{font-size:25px}}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:38px 40px;box-shadow:var(--shadow);min-width:0}
@media (max-width:720px){.panel{padding:24px 20px}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ph h3{margin:10px 0 0;font-size:25px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.ph p{margin:10px 0 0;color:var(--ink-2);max-width:68ch}
.conf{padding:7px 14px;border-radius:9px;background:var(--green-soft);color:var(--green-d);font-size:13px;font-weight:700;white-space:nowrap}
.rule{border:0;border-top:1.5px dashed var(--dash);margin:28px 0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:960px){.g3{grid-template-columns:1fr}}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
.inner{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;min-width:0}
@media (max-width:720px){.inner{padding:22px 20px}}
.inner h4{margin:14px 0 0;font-size:19px;font-weight:700;line-height:1.35;letter-spacing:-.005em}
.inner p{margin:12px 0 0;color:var(--ink-2);font-size:15px}
.inner p b,.panel p b,li b{color:var(--green-d);font-weight:700}
.inner p b.neg,.panel p b.neg{color:var(--neg)}
.statline{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.statline div{display:flex;flex-direction:column}
.statline .sv{font-size:22px;font-weight:700;letter-spacing:-.01em}
.statline .sv.neg{color:var(--neg)} .statline .sv.pos{color:var(--green)}
.statline .sl{font-size:12px;color:var(--muted)}
.hero-num{font-size:44px;font-weight:700;color:var(--green);letter-spacing:-.02em;line-height:1;margin-top:16px}
.hero-num small{font-size:16px;color:var(--muted);font-weight:700;margin-left:6px;letter-spacing:0}

.prio{background:var(--tab);color:#f3efe6;border-radius:var(--r-md);padding:30px 32px;display:flex;flex-direction:column;gap:14px}
.prio .cap{color:#b9bdb4}
.prio .pv{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.prio .pv b{color:#cfe0cf}
.prio .row{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;font-size:14.5px;color:#d9d6cc;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.prio .row strong{color:#fff}

/* pills */
.pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--soft);border:1px solid var(--line);color:var(--ink-2)}
.pill.g{background:var(--green-soft);border-color:transparent;color:var(--green-d)}
.pill.n{background:var(--neg-soft);border-color:transparent;color:var(--neg)}
.pill.a{background:var(--amb-soft);border-color:transparent;color:var(--amb)}
.pos{color:var(--green)} .neg{color:var(--neg)} .muted{color:var(--muted)}

/* day cards */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px}
.day{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:24px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.day.is-pri::after{background:var(--neg)}
.day .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.day .nm{font-size:18px;font-weight:700}
.day .rk{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.day .rv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.day .rv .v{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.day .rv .u{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.trend{font-size:13px;font-weight:700}
.meter{position:relative;height:7px;border-radius:99px;background:#efe9de}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px}
.meter .avg{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink-2)}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
.spark svg{display:block;width:100%;height:46px;overflow:visible}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding-top:14px;border-top:1px dashed var(--dash)}
.mets div{display:flex;flex-direction:column;min-width:0}
.mets .ml{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.mets .mv{font-size:16px;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:#d9d2c3;display:inline-block}
.dot.pos{background:var(--green)} .dot.neg{background:var(--neg)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}

/* funnel leak */
.leak{display:grid;gap:22px;margin-top:26px}
.leak-row{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:640px){.leak-row{grid-template-columns:1fr;gap:8px}}
.leak-row .lab{font-weight:700;font-size:14.5px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:64px minmax(0,1fr) 52px 60px;gap:10px;align-items:center;font-size:12.5px}
.bar .who{color:var(--muted);font-weight:700}
.bar .track{height:9px;border-radius:99px;background:#f0ebe1;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
.bar .val{text-align:right;font-weight:700}
.bar .dlt{text-align:right;font-weight:700}

/* budget */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:24px}
@media (max-width:960px){.cal{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.cal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cal .c{border-radius:var(--r-sm);padding:18px 14px;border:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;gap:8px;min-width:0;border-top:4px solid var(--line-2)}
.cal .c .dn{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.cal .c .mode{font-size:14px;font-weight:700;line-height:1.3}
.cal .c .bud{font-size:21px;font-weight:700;letter-spacing:-.01em}
.cal .c .chg{font-size:12.5px;font-weight:700}
.cal .c .note{font-size:12.5px;color:var(--muted);line-height:1.45}
.m-scale{border-top-color:var(--green)!important} .m-scale .mode{color:var(--green)}
.m-cons{border-top-color:var(--neg)!important} .m-cons .mode{color:var(--neg)}
.m-test{border-top-color:var(--amb)!important} .m-test .mode{color:var(--amb)}
.m-hold .mode{color:var(--ink-2)}

.db{display:grid;gap:16px;margin-top:24px}
.db-row{display:grid;grid-template-columns:44px minmax(0,1fr) 112px;gap:12px;align-items:center;font-size:13px}
.db-row .dn{font-weight:700;color:var(--ink-2)}
.db-track{position:relative;height:22px}
.db-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-2)}
.db-track .seg{position:absolute;top:50%;height:3px;transform:translateY(-50%);border-radius:2px}
.db-track .p{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%)}
.db-track .p.cur{background:var(--paper);border:2px solid var(--faint)}
.db-row .vals{text-align:right;color:var(--muted);white-space:nowrap}
.db-row .vals b{color:var(--ink);font-weight:700}
.db-axis{display:grid;grid-template-columns:44px minmax(0,1fr) 112px;gap:12px;font-size:11.5px;color:var(--faint);margin-top:6px}
.db-axis div{display:flex;justify-content:space-between}

.vbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end;height:200px;margin-top:26px;position:relative}
.vbars .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.vbars .col i{display:block;width:min(64px,72%);border-radius:10px 10px 4px 4px}
.vbars .col .v{font-size:14px;font-weight:700}
.vbars .col .k{font-size:12px;color:var(--muted);font-weight:700;height:18px;line-height:18px}
.vbars .ref{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint)}
.vbars .ref span{position:absolute;right:0;top:-20px;font-size:11.5px;color:var(--muted);font-weight:700}

/* behaviour */
.kv{display:flex;gap:28px;flex-wrap:wrap;margin-top:16px}
.kv div{display:flex;flex-direction:column}
.kv .v{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.kv .v.pos{color:var(--green)} .kv .v.neg{color:var(--neg)}
.kv .l{font-size:12px;color:var(--muted)}
.read{margin-top:14px;font-size:14px;color:var(--ink-2);border-left:3px solid var(--green-line);padding-left:14px}
.hbars{display:grid;gap:11px;margin-top:18px}
.hbar{display:grid;grid-template-columns:86px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:13px}
.hbar .k{color:var(--ink-2);font-weight:700}
.hbar .t{height:10px;background:#f0ebe1;border-radius:99px;position:relative}
.hbar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hbar .t .ref{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink-2)}
.hbar .v{text-align:right;font-weight:700}

/* actions */
.recs{display:grid;gap:14px}
.rec{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:22px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:26px 28px;box-shadow:var(--shadow)}
@media (max-width:700px){.rec{grid-template-columns:44px minmax(0,1fr);padding:20px}.rec .meta{grid-column:2;justify-content:flex-start!important}}
.rec .pn{font-weight:900;font-size:14px;color:#f3efe6;background:var(--green);border-radius:10px;height:40px;display:grid;place-items:center}
.rec h4{margin:0;font-size:18px;font-weight:700;line-height:1.35}
.rec p{margin:8px 0 0;color:var(--ink-2);font-size:15px;max-width:74ch}
.rec .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
@media (max-width:960px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.acts{grid-template-columns:1fr}}
.act{border:1px solid var(--line);border-radius:var(--r-sm);padding:20px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.act .what{font-size:14.5px;line-height:1.5}
.final{background:linear-gradient(100deg,var(--brief-a),var(--brief-b));border:1px solid var(--line-2);border-radius:var(--r-lg);padding:34px 38px}
@media (max-width:720px){.final{padding:24px}}
.final .v{font-size:clamp(22px,2.8vw,30px);font-weight:700;line-height:1.3;margin-top:10px;letter-spacing:-.01em}
.final .v u{text-decoration:none;color:var(--green);border-bottom:2px solid var(--green-line)}
.final .rs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:22px}
@media (max-width:760px){.final .rs{grid-template-columns:1fr}}
.final .rs > div{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:var(--r-md);padding:22px 24px}
.final .rs h4{margin:0;font-size:17px}
.final .rs p{margin:8px 0 0;color:var(--ink-2);font-size:14.5px}

.notes{margin-top:40px;color:var(--muted);font-size:13px}
.notes ul{margin:10px 0 0;padding-left:1.1em;display:grid;gap:6px;max-width:92ch}
@media (prefers-reduced-motion:no-preference){.pane{animation:fade .35s ease both}@keyframes fade{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
